<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Libro Maestro | Dashboard</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root{--navy:#12355b;--blue:#1d4f80;--gold:#f0a202;--ink:#1f334d;--muted:#65758b;--line:#dfe7f0}
    *{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#f5f7fb;color:var(--ink)}
    .header{margin-left:300px;min-height:136px;display:flex;align-items:center;justify-content:space-between;padding:28px 48px;background:linear-gradient(115deg,var(--navy),var(--blue));color:#fff;border-bottom:4px solid var(--gold)}
    h1{margin:0 0 7px;font-size:34px}.header p{margin:0;color:#dbe8f5}.brand{display:flex;gap:16px;align-items:center}.mark{display:grid;place-items:center;width:48px;height:48px;border-radius:12px;background:var(--gold);color:var(--navy);font-weight:800}.status{border:1px solid #ffffff45;border-radius:20px;padding:8px 13px;font-size:12px;color:#e6f5eb}
    .sidebar{position:fixed;top:0;bottom:0;width:300px;padding:28px 22px;background:#fff;border-right:1px solid var(--line);overflow:auto}.side-brand{display:flex;align-items:center;gap:11px;padding:4px 4px 28px;color:var(--navy)}.side-brand b,.side-brand small{display:block}.side-brand b{font-size:13px;letter-spacing:.8px}.side-brand small{color:var(--muted);font-size:11px;margin-top:3px}.side-mark{width:38px;height:38px;border-radius:9px;font-size:13px}.sidebar h3{border-top:1px solid var(--line);padding-top:20px;color:var(--navy);font-size:16px}.filter{margin-bottom:16px}.filter label{display:block;margin-bottom:7px;color:var(--muted);font-size:12px;font-weight:700}.filter select{width:100%;min-height:40px;border:1px solid #cbd7e5;border-radius:8px;padding:7px;background:#fff;color:var(--ink);font-size:12px}.filter select[multiple]{height:82px}.clear{width:100%;padding:10px;border:1px solid #c7d5e4;border-radius:8px;background:#f8fafc;color:var(--navy);font-weight:700;cursor:pointer}.clear:hover{background:var(--navy);color:#fff}.hint{color:var(--muted);font-size:11px;line-height:1.5}
    main{margin-left:300px;padding:36px 48px 50px}.section-title{color:var(--navy);font-size:21px;margin:0 0 20px}.metrics,.charts{display:grid;gap:20px}.metrics{grid-template-columns:repeat(5,minmax(140px,1fr));margin-bottom:30px}.metric,.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 16px #1f334d12}.metric{padding:18px 19px;border-top:3px solid #4f83b4}.metric label{display:block;color:var(--muted);font-size:11px;font-weight:700;margin-bottom:12px;letter-spacing:.2px}.metric strong{color:var(--navy);font-size:25px}.charts{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:24px}.chart{height:430px;padding:20px;overflow:hidden}.card{padding:24px}.card h2{margin:0 0 6px;color:var(--navy);font-size:21px}.card p{color:var(--muted);font-size:13px}.download{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer;margin:12px 0 20px}.download:hover{background:var(--blue)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{background:var(--navy);color:#fff;text-align:left;padding:10px;white-space:nowrap}td{padding:8px;border-bottom:1px solid var(--line);max-width:260px}tr:nth-child(even){background:#f8fafc}.pages{display:flex;gap:8px;align-items:center;margin-top:14px}.pages button{border:1px solid var(--line);background:white;border-radius:6px;padding:7px 11px;cursor:pointer}@media(max-width:1100px){.metrics{grid-template-columns:repeat(3,1fr)}}@media(max-width:900px){.header{margin-left:0;padding:22px 20px}.status{display:none}.sidebar{position:static;width:auto;padding:20px}.sidebar select[multiple]{height:90px}main{margin-left:0;padding:22px 18px}.metrics,.charts{grid-template-columns:1fr}h1{font-size:26px}}
  </style>
</head>
<body>
  <header class="header"><div class="brand"><div class="mark">LM</div><div><h1>Libro Maestro de Documentos</h1><p>Centro de control documental · Dashboard interactivo</p></div></div><div class="status">● Panel activo</div></header>
  <aside class="sidebar"><div class="side-brand"><div class="mark side-mark">LM</div><div><b>LIBRO MAESTRO</b><small>Gestión documental</small></div></div><h3>🎛️ Segmentadores</h3><button class="clear" id="clear">✕ Limpiar filtros</button><p class="hint" id="hint">Haz clic en una barra o segmento para filtrar todo el dashboard.</p><div id="filters"></div></aside>
  <main><h2 class="section-title">📌 Indicadores clave</h2><section class="metrics"><div class="metric"><label>DOCUMENTOS</label><strong id="total">-</strong></div><div class="metric"><label>APROBADOS</label><strong id="approved">-</strong></div><div class="metric"><label>NO CREADOS</label><strong id="notCreated">-</strong></div><div class="metric"><label>PROMEDIO APROBACIÓN</label><strong id="approvalDays">-</strong></div><div class="metric"><label>PROMEDIO REVISIÓN</label><strong id="reviewDays">-</strong></div></section><section class="charts"><div class="card chart" id="statusChart"></div><div class="card chart" id="unitChart"></div><div class="card chart" id="typeChart"></div><div class="card chart" id="processChart"></div></section><section class="card"><h2>📋 Detalle del libro maestro</h2><p id="count">-</p><button class="download" id="download">⬇️ Descargar datos filtrados (CSV)</button><div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><div class="pages"><button id="prev">Anterior</button><span id="page"></span><button id="next">Siguiente</button></div></section></main>
<script>
const state={data:[],filters:{},chart:null,page:0,size:15};
const fields=[["UNIDAD DE NEGOCIO","Unidad de negocio"],["MACROPROCESO","Macroproceso"],["PROCESO","Proceso"],["ESTADO","Estado"],["TIPO DE DOCUMENTO","Tipo de documento"]];
const $=id=>document.getElementById(id);
function unique(col){return [...new Set(state.data.map(r=>r[col]).filter(Boolean))].sort()}
function buildFilters(){const box=$("filters");fields.forEach(([col,label])=>{const wrap=document.createElement("div");wrap.className="filter";wrap.innerHTML=`<label>${label}</label><select multiple data-col="${col}">${unique(col).map(v=>`<option>${v}</option>`).join("")}</select>`;wrap.querySelector("select").onchange=()=>{state.page=0;render()};box.appendChild(wrap)})}
function filtered(){return state.data.filter(r=>Object.entries(state.filters).every(([c,v])=>!v.length||v.includes(r[c]))).filter(r=>!state.chart||r[state.chart.column]===state.chart.value)}
function avg(rows,col){const a=rows.map(r=>Number(r[col])).filter(Number.isFinite);return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length)+" días":"N/D"}
function counts(rows,col){const m={};rows.forEach(r=>{const v=r[col]||"Sin dato";m[v]=(m[v]||0)+1});return Object.entries(m).map(([x,y])=>({x,y})).sort((a,b)=>b.y-a.y)}
function layout(title,type){return {title:{text:title,x:.04,font:{size:16,color:"#12355b"}},margin:{t:50,b:type==="hbar"?35:55,l:type==="hbar"?175:55,r:25},paper_bgcolor:"#fff",plot_bgcolor:"#fff",font:{family:"Segoe UI,Arial",color:"#53657a"},clickmode:"event+select",hoverlabel:{bgcolor:"#12355b",font:{color:"#fff"}}}}
function draw(id,items,type,title,col){if(!items.length){Plotly.react($(id),[],layout(title,type));return}let x=items.map(a=>a.x),y=items.map(a=>a.y),data=type==="pie"?[{labels:x,values:y,type:"pie",hole:.55,textinfo:"percent",textposition:"inside"}]:[{x:type==="bar"?x:y,y:type==="bar"?y:x,type:"bar",orientation:type==="bar"?"v":"h",marker:{color:"#4f83b4",line:{color:"#fff",width:1}},text:y,textposition:"auto"}];Plotly.react($(id),data,layout(title,type));$(id).removeAllListeners("plotly_click");$(id).on("plotly_click",e=>{if(e.points?.[0]){state.chart={column:col,value:e.points[0].label||e.points[0].y||e.points[0].x};render()}})}
function render(){const rows=filtered(),total=rows.length;$("total").textContent=total.toLocaleString();$("approved").textContent=rows.filter(r=>r.ESTADO==="Aprobado").length.toLocaleString();$("notCreated").textContent=rows.filter(r=>r.ESTADO==="No creado").length.toLocaleString();$("approvalDays").textContent=avg(rows,"DIAS HASTA APROBACION");$("reviewDays").textContent=avg(rows,"DIAS HASTA REVISION");$("count").textContent=`${total.toLocaleString()} registros encontrados`;$("hint").textContent=state.chart?`🔎 Selección activa: ${state.chart.value}`:"Haz clic en una barra o segmento para filtrar todo el dashboard.";draw("statusChart",counts(rows,"ESTADO"),"pie","Documentos por estado","ESTADO");draw("unitChart",counts(rows,"UNIDAD DE NEGOCIO"),"bar","Documentos por unidad de negocio","UNIDAD DE NEGOCIO");draw("typeChart",counts(rows,"TIPO DE DOCUMENTO").slice(0,12).reverse(),"hbar","Tipos de documento","TIPO DE DOCUMENTO");const processes={};rows.forEach(r=>{if(Number.isFinite(Number(r["DIAS HASTA APROBACION"]))) (processes[r.PROCESO]??=[]).push(Number(r["DIAS HASTA APROBACION"]))});draw("processChart",Object.entries(processes).map(([x,a])=>({x,y:Math.round(a.reduce((p,q)=>p+q,0)/a.length)})).sort((a,b)=>b.y-a.y).slice(0,10).reverse(),"hbar","Procesos con mayor tiempo de ciclo","PROCESO");renderTable(rows)}
function renderTable(rows){const cols=state.data.length?Object.keys(state.data[0]):[];$("thead").innerHTML="<tr>"+cols.map(c=>`<th>${c}</th>`).join("")+"</tr>";const start=state.page*state.size; $("tbody").innerHTML=rows.slice(start,start+state.size).map(r=>"<tr>"+cols.map(c=>`<td>${r[c]??""}</td>`).join("")+"</tr>").join("");const pages=Math.max(1,Math.ceil(rows.length/state.size));if(state.page>=pages)state.page=pages-1;$("page").textContent=`Página ${state.page+1} de ${pages}`;$("prev").disabled=state.page===0;$("next").disabled=state.page>=pages-1}
fields.forEach(([c])=>state.filters[c]=[]);$("clear").onclick=()=>{document.querySelectorAll("select").forEach(s=>s.selectedIndex=-1);fields.forEach(([c])=>state.filters[c]=[]);state.chart=null;state.page=0;render()};$("prev").onclick=()=>{if(state.page){state.page--;renderTable(filtered())}};$("next").onclick=()=>{if((state.page+1)*state.size<filtered().length){state.page++;renderTable(filtered())}};$("download").onclick=()=>{const rows=filtered(),cols=Object.keys(state.data[0]||{}),csv=[cols,...rows.map(r=>cols.map(c=>`"${String(r[c]??"").replaceAll('"','""')}"`))].map(r=>r.join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"}));a.download="libro_maestro_filtrado.csv";a.click()};
fetch("data.json").then(r=>r.json()).then(data=>{state.data=data;fields.forEach(([c])=>state.filters[c]=[]);buildFilters();document.querySelectorAll("select").forEach(s=>s.onchange=()=>{state.filters[s.dataset.col]=[...s.selectedOptions].map(o=>o.value);state.page=0;render()});render()});
</script>
</body></html>
